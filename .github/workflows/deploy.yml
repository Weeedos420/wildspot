# Publishes Wildspot on GitHub Pages.
# - every push to main: redeploys the app with the current data
# - on the 1st of every month (and on demand): re-downloads all of Australia from OpenStreetMap first
name: Build & deploy
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 15 1 * *' # 1st of the month, ~2am Melbourne time
  workflow_dispatch:
    inputs:
      refresh_data:
        description: 'Riscarica i dati di tutta l''Australia'
        type: boolean
        default: true
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  data:
    if: github.event_name == 'schedule' || inputs.refresh_data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - run: curl -fsSL -o australia.osm.pbf https://download.geofabrik.de/australia-oceania/australia-latest.osm.pbf
      - run: node scripts/build-data.mjs australia.osm.pbf
      - name: Save data on the "data" branch (one commit, so the repo does not grow every month)
        run: |
          cd data
          git init -q -b data
          git config user.name "wildspot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Dati OpenStreetMap $(date +%F)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
  deploy:
    needs: data
    if: always() && (needs.data.result == 'success' || needs.data.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        continue-on-error: true # the data branch does not exist until the first data run
        with:
          ref: data
          path: data
      - run: rm -rf data/.git scripts package.json .gitignore
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
